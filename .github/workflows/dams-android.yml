name: DAMS Android Release

on:
  push:
    branches:
      - dams/ci

# Lecture seule par défaut ; l'écriture (release) est accordée au seul job build.
permissions:
  contents: read

# Un seul build à la fois : les pushes rapprochés annulent le run en cours
# au lieu de courir en parallèle sur le même tag de release.
concurrency:
  group: dams-android
  cancel-in-progress: true

jobs:
  build:
    name: Build arm64 release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout core
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Go (avec cache modules + build)
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 1.26.10
          cache: true

      # Le cache Gradle n'écrit jamais sur une branche non-défaut par défaut :
      # on force read/write pour que la branche dams/ci peupler son cache.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Checkout Android client
        run: git submodule update --init --depth 1 --recursive clients/android

      # Clé = hash de toutes les sources Go + go.mod/sum + Makefile.
      # Si aucun fichier Go n'a changé (bump sous-module, docs...),
      # on réutilise les AAR construits au run précédent et on saute
      # la construction libbox (double gomobile bind ≈ 15-30 min).
      - name: Restore libbox artifacts
        id: libbox-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            libbox.aar
            libbox-legacy.aar
          key: libbox-arm64-ndk-r28-go1.26.10-${{ hashFiles('go.mod', 'go.sum', 'Makefile', '**/*.go') }}

      # Le NDK (téléchargement lourd) n'est utile que si on reconstruit libbox.
      - name: Setup Android NDK
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1 (1.6.0)
        with:
          ndk-version: r28

      - name: Build libbox (arm64)
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          ls -l libbox.aar libbox-legacy.aar

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > clients/android/app/release.keystore
          ls -l clients/android/app/release.keystore

      - name: Run unit tests
        run: |
          mkdir -p clients/android/app/libs
          cp libbox.aar clients/android/app/libs/
          cd clients/android
          ./gradlew :app:testOtherDebugUnitTest --parallel

      - name: Build release APK
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          cd clients/android
          ./gradlew --build-cache :app:assembleOtherRelease --parallel

      - name: Cleanup signing material
        run: rm -f clients/android/app/release.keystore

      - name: Prepare artifact
        run: |
          mkdir -p dist
          VERSION=$(grep '^VERSION_NAME=' clients/android/version.properties | cut -d= -f2)
          APK=$(find clients/android/app/build/outputs/apk/other/release -name '*.apk' -type f | head -n1)
          test -n "$APK"
          cp "$APK" "dist/DAMS-TUNNEL-${VERSION}-arm64.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cd dist
          sha256sum "DAMS-TUNNEL-${VERSION}-arm64.apk" > SHA256SUMS.txt
          ls -lh
          cd ..
          unzip -l "dist/DAMS-TUNNEL-${VERSION}-arm64.apk" | sort -k1 -nr | head -30

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dams-android-arm64
          path: dist/*

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ env.VERSION }}
        run: |
          TAG="dams-v${VERSION}-arm64"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "DAMS TUNNEL ${VERSION} (arm64)" \
              --prerelease \
              --notes "Build automatique de DAMS TUNNEL pour arm64-v8a. APK de test signé avec une clé de test. Somme de contrôle : SHA256SUMS.txt."
          fi
