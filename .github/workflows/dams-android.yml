name: DAMS Android Debug

on:
  push:
    branches:
      - dams/ci

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout core
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Build libbox
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/arm64
          ls -l libbox.aar libbox-legacy.aar

      - name: Checkout Android client
        run: git submodule update --init --recursive clients/android

      - name: Setup OpenJDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
        with:
          cache-provider: basic

      - name: Build debug APKs and run unit tests
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p clients/android/app/libs
          cp libbox.aar libbox-legacy.aar clients/android/app/libs/
          cd clients/android
          ./gradlew --build-cache --parallel :app:testOtherDebugUnitTest :app:assembleOtherDebug :app:assembleOtherLegacyDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: dams-android-debug
          path: |
            clients/android/app/build/outputs/apk/other/debug/*.apk
            clients/android/app/build/outputs/apk/otherLegacy/debug/*.apk
