<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020b20">
<title>A2M TUN — Interface</title>
<style>
:root {
  --bg:#02091a;
  --cyan:#12e7ff;
  --blue:#087dff;
  --text:#f4f8ff;
  --muted:#9db8df;
}
* { box-sizing:border-box; }
html,body {
  margin:0; min-height:100%;
  background:var(--bg); color:var(--text);
  font-family:Inter,Roboto,"Segoe UI",Arial,sans-serif;
}
body { min-height:100svh; overflow-x:hidden; }
.app {
  width:100%; max-width:520px; min-height:100svh;
  margin:auto; position:relative;
  padding:calc(24px + env(safe-area-inset-top)) 18px calc(112px + env(safe-area-inset-bottom));
  background:
    radial-gradient(ellipse at 50% 30%,rgba(0,108,255,.20),transparent 42%),
    linear-gradient(180deg,#02091a,#03112a 55%,#02091a);
}
header {
  display:flex; align-items:center; gap:13px;
  position:relative; z-index:2;
}
.menu {
  width:54px; height:54px; flex:0 0 54px;
  border:1px solid #174a91; border-radius:17px;
  display:grid; place-items:center;
  background:linear-gradient(145deg,#0b2147,#06132c);
}
.hamb { width:25px; display:grid; gap:5px; }
.hamb i {
  height:3px; border-radius:4px;
  background:#dcecff; display:block;
}
.logo { width:66px; height:74px; flex:0 0 66px; }
.brand { min-width:0; }
.brand h1 {
  font-size:clamp(22px,6vw,29px);
  margin:0 0 5px; font-weight:750;
}
.brand p {
  font-size:clamp(13px,3.7vw,17px);
  font-weight:650; color:var(--cyan); margin:0;
}
.world {
  height:clamp(270px,75vw,390px);
  position:relative; margin:18px -18px 0;
  overflow:hidden; display:grid; place-items:center;
}
.world svg.map {
  position:absolute; width:112%; height:100%;
  inset:0 -6%; opacity:.95;
}
.world:after {
  content:""; position:absolute; inset:0;
  background:radial-gradient(ellipse at center,transparent 35%,#02091a 95%);
  pointer-events:none;
}
.orbit {
  position:absolute; width:95%; height:50%;
  border:1px solid #058cff88; border-radius:50%;
  transform:rotate(-12deg);
  filter:drop-shadow(0 0 5px #00aaff); z-index:1;
}
.orbit.two {
  width:105%; height:34%;
  transform:rotate(12deg);
  border-color:#00dfff66;
}
.connect {
  position:relative; z-index:2;
  width:clamp(210px,58vw,270px);
  aspect-ratio:1; border-radius:50%;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:13px;
  background:radial-gradient(circle at 40% 28%,#0b3c78,#061b3e 52%,#020d25);
  border:7px solid transparent;
  background-clip:padding-box;
  box-shadow:0 0 0 3px #08dfff,0 0 18px 7px #007bff99,0 0 48px #005dff88,inset 0 0 28px #087dff66;
  cursor:pointer; color:white;
}
.connect:before {
  content:""; position:absolute; inset:-13px;
  border-radius:50%; border:3px solid #167cff;
  box-shadow:0 0 22px #007bff;
}
.connect svg {
  width:75px; height:75px; color:var(--cyan);
  filter:drop-shadow(0 0 10px #00cfff);
}
.connect strong {
  font-size:clamp(23px,6vw,30px);
}
.connect.active {
  box-shadow:0 0 0 3px #20f3b1,0 0 25px 9px #00d99a88;
}
.hint {
  position:relative; z-index:2;
  text-align:center; color:#b3d2ff;
  font-size:clamp(14px,4vw,18px);
  font-weight:600; margin:-3px 0 24px;
}
.card {
  border:1px solid #1766bd; border-radius:25px;
  background:linear-gradient(125deg,rgba(7,43,91,.96),rgba(4,17,42,.98));
  box-shadow:0 0 14px #007bff35,inset 0 0 18px #087dff18;
  margin:0 0 18px;
}
.server {
  min-height:118px; padding:17px 16px;
  display:flex; align-items:center; gap:17px;
  cursor:pointer;
}
.server-icon {
  width:84px; height:84px; flex:0 0 84px;
  border-radius:20px; background:#08285a;
  display:grid; place-items:center;
}
.server-icon svg {
  width:66px; height:66px; color:#08dfff;
}
.server-copy { min-width:0; flex:1; }
.server-copy b {
  font-size:clamp(16px,4.5vw,20px);
  display:block; line-height:1.25;
}
.server-copy span {
  display:block; color:#b2d1ff;
  font-size:clamp(13px,3.7vw,16px); margin-top:7px;
}
.chevron { font-size:36px; color:#d6e8ff; }
.stats {
  padding:23px 12px 12px;
  display:grid; grid-template-columns:1fr 1fr;
  position:relative; overflow:hidden; min-height:150px;
}
.stat {
  display:flex; align-items:center; justify-content:center;
  gap:12px; min-width:0; padding:0 5px 20px;
}
.stat+.stat { border-left:1px solid #1a5da5; }
.stat svg { width:40px; height:48px; flex:0 0 40px; }
.stat .down { color:var(--cyan); }
.stat .up { color:#9b5cff; }
.stat strong {
  font-size:clamp(21px,6vw,27px);
  display:block; white-space:nowrap;
}
.stat small {
  display:block; color:#b4d1fa;
  font-size:clamp(12px,3.5vw,15px); margin-top:4px;
}
.wave {
  position:absolute; bottom:0; left:0;
  width:100%; height:35px;
}
.ip {
  min-height:78px; padding:14px 19px;
  display:flex; align-items:center; gap:15px;
}
.ip svg {
  width:42px; height:42px; color:var(--cyan);
  flex:0 0 42px;
}
.ip strong { font-size:clamp(17px,4.7vw,21px); flex:1; }
.refresh {
  border:0; background:transparent;
  color:var(--cyan); font-size:34px; cursor:pointer;
}
nav {
  position:fixed; z-index:5; bottom:0;
  left:50%; transform:translateX(-50%);
  width:min(100%,520px);
  padding:13px 5px calc(14px + env(safe-area-inset-bottom));
  display:grid; grid-template-columns:repeat(4,1fr);
  background:linear-gradient(180deg,rgba(4,20,47,.96),rgba(2,10,27,.99));
  border:1px solid #15549b; border-bottom:0;
  border-radius:30px 30px 0 0;
}
nav button {
  border:0; background:transparent; color:#9db8df;
  display:flex; flex-direction:column; align-items:center;
  gap:7px; font-size:14px; padding:5px 0; cursor:pointer;
}
nav button svg { width:29px; height:29px; }
nav button.selected { color:var(--cyan); }
.toast {
  position:fixed; z-index:10; left:50%;
  bottom:105px; transform:translateX(-50%);
  background:#102b50; border:1px solid #168bd5;
  border-radius:12px; padding:11px 16px;
  color:white; font-size:14px; display:none;
}
@media(min-width:520px) {
  .app { border-left:1px solid #0b2850; border-right:1px solid #0b2850; }
}
</style>
</head>
<body>
<main class="app">

<header>
  <button class="menu" aria-label="Menu">
    <span class="hamb"><i></i><i></i><i></i></span>
  </button>

  <svg class="logo" viewBox="0 0 80 90">
    <defs>
      <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
        <stop stop-color="#00edff"/>
        <stop offset=".55" stop-color="#087cff"/>
        <stop offset="1" stop-color="#8a42ff"/>
      </linearGradient>
    </defs>
    <path d="M40 3 73 19 70 55 40 84 10 55 7 19Z"
      fill="none" stroke="url(#shield)" stroke-width="8"/>
    <path d="M40 15 62 26 60 51 40 70 20 51 18 26Z"
      fill="#08234d" stroke="#08bfff" stroke-width="2"/>
    <path d="M31 28h14c10 0 15 7 15 17s-6 17-16 17H31V28Zm9 8v18h4c5 0 7-3 7-9s-2-9-7-9h-4Z"
      fill="url(#shield)"/>
  </svg>

  <div class="brand">
    <h1>A2M TUN</h1>
    <p>VPN Rapide &amp; Sécurisé</p>
  </div>
</header>

<section class="world">
  <svg class="map" viewBox="0 0 600 340">
    <defs>
      <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.65" fill="#08bfff"/>
      </pattern>
    </defs>
    <g fill="url(#dots)">
      <path d="M30 80 60 53 94 48 113 32 155 38 180 56 169 79 142 91 133 117 110 130 99 165 78 172 61 143 42 129Z"/>
      <path d="M130 174 155 182 174 210 168 242 154 273 143 302 129 283 132 251 117 224Z"/>
      <path d="M260 70 284 55 302 64 294 80 276 83Z"/>
      <path d="M285 104 314 88 351 91 370 77 413 83 435 67 478 77 507 99 535 105 551 131 529 151 494 144 473 161 444 152 422 176 390 169 374 188 349 172 326 183 305 158 278 151 265 129Z"/>
      <path d="M317 178 345 181 359 207 351 245 331 274 316 252 306 220Z"/>
      <path d="M470 205 493 197 516 211 528 238 511 256 488 245 473 228Z"/>
    </g>
    <g fill="none" stroke="#00bfff" stroke-width="1.2">
      <path d="M65 119 Q190 5 302 132 T520 110"/>
      <path d="M80 220 Q270 25 470 225"/>
      <path d="M150 68 Q260 270 420 80"/>
      <path d="M40 155 Q270 300 560 145"/>
    </g>
  </svg>

  <div class="orbit"></div>
  <div class="orbit two"></div>

  <button class="connect" id="connect">
    <svg viewBox="0 0 80 80" fill="none"
      stroke="currentColor" stroke-width="8" stroke-linecap="round">
      <path d="M40 9v31"/>
      <path d="M20 22a30 30 0 1 0 40 0"/>
    </svg>
    <strong id="connectText">CONNECTER</strong>
  </button>
</section>

<p class="hint" id="hint">Appuyez pour démarrer le tunnel</p>

<section class="card server" id="serverCard">
  <div class="server-icon">
    <svg viewBox="0 0 70 70" fill="none" stroke="currentColor" stroke-width="5">
      <rect x="8" y="8" width="54" height="15" rx="4"/>
      <rect x="8" y="28" width="54" height="15" rx="4"/>
      <rect x="8" y="48" width="54" height="15" rx="4"/>
      <circle cx="17" cy="15.5" r="1.5" fill="currentColor"/>
      <circle cx="17" cy="35.5" r="1.5" fill="currentColor"/>
      <circle cx="17" cy="55.5" r="1.5" fill="currentColor"/>
    </svg>
  </div>
  <div class="server-copy">
    <b>Aucun serveur sélectionné</b>
    <span>Touchez pour choisir un serveur</span>
  </div>
  <div class="chevron">›</div>
</section>

<section class="card stats">
  <div class="stat">
    <svg class="down" viewBox="0 0 40 48" fill="none"
      stroke="currentColor" stroke-width="5" stroke-linecap="round">
      <path d="M20 4v35M5 25l15 15 15-15"/>
    </svg>
    <div><strong>0 B/s</strong><small>Téléchargement</small></div>
  </div>
  <div class="stat">
    <svg class="up" viewBox="0 0 40 48" fill="none"
      stroke="currentColor" stroke-width="5" stroke-linecap="round">
      <path d="M20 44V9M5 24 20 9l15 15"/>
    </svg>
    <div><strong>0 B/s</strong><small>Téléversement</small></div>
  </div>
  <svg class="wave" viewBox="0 0 500 40" preserveAspectRatio="none">
    <path d="M0 23 Q25 8 50 23 T100 23 T150 23 T200 23 T250 23 T300 23 T350 23 T400 23 T450 23 T500 23"
      fill="none" stroke="#08cfff" stroke-width="2"/>
  </svg>
</section>

<section class="card ip">
  <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3">
    <circle cx="24" cy="24" r="19"/>
    <path d="M5 24h38M24 5c-12 12-12 26 0 38M24 5c12 12 12 26 0 38M8 14h32M8 34h32"/>
  </svg>
  <strong>IP de sortie : <span>---</span></strong>
  <button class="refresh" id="refresh">↻</button>
</section>

</main>

<nav>
  <button class="selected" data-tab="Accueil">
    <span>⌂</span>Accueil
  </button>
  <button data-tab="Serveurs">
    <span>▤</span>Serveurs
  </button>
  <button data-tab="Journal">
    <span>▥</span>Journal
  </button>
  <button data-tab="Paramètres">
    <span>⚙</span>Paramètres
  </button>
</nav>

<div class="toast" id="toast"></div>

<script>
const connect = document.getElementById('connect');
const toast = document.getElementById('toast');
let connected = false;

function message(text) {
  toast.textContent = text;
  toast.style.display = 'block';
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => {
    toast.style.display = 'none';
  }, 2200);
}

connect.addEventListener('click', () => {
  connected = !connected;
  connect.classList.toggle('active', connected);

  document.getElementById('connectText').textContent =
    connected ? 'CONNECTÉ' : 'CONNECTER';

  document.getElementById('hint').textContent =
    connected
      ? 'Interface de démonstration — aucun tunnel VPN actif'
      : 'Appuyez pour démarrer le tunnel';

  message(connected ? 'État visuel activé (démo)' : 'État visuel désactivé (démo)');
});

document.getElementById('serverCard').addEventListener('click', () => {
  message('Connectez votre sélecteur de serveurs ici.');
});

document.getElementById('refresh').addEventListener('click', () => {
  message('Reliez ce bouton à votre fonction réelle de récupération IP.');
});

document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => {
      b.classList.remove('selected');
    });
    btn.classList.add('selected');
    message('Onglet ' + btn.dataset.tab);
  });
});
</script>
</body>
</html>
